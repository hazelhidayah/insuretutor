services:
  app:
    build:
      context: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.openai.com/v1}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-gpt-4.1-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-6}
    volumes:
      - model-cache:/app/.cache
    restart: unless-stopped

volumes:
  model-cache:
